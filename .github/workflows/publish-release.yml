name: Publish Demo Release

on:
  push:
    tags:
      - "demo-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish manager preview
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        run: dotnet restore .\Nexora.Demo.slnx

      - name: Build Release
        run: dotnet build .\Nexora.Demo.slnx --configuration Release --no-restore

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish .\Nexora.Demo.Desktop\Nexora.Demo.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\publish

      - name: Package release ZIP
        shell: pwsh
        run: |
          $publishPath = Join-Path $PWD 'artifacts\publish'
          $zipPath = Join-Path $PWD 'artifacts\Nexora-Demo-Preview-win-x64.zip'
          if (-not (Test-Path -LiteralPath $publishPath -PathType Container)) { throw 'Publish output was not created.' }
          Compress-Archive -Path (Join-Path $publishPath '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "Nexora Demo Preview ${{ github.ref_name }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ## Nexora Demo Preview

            Windows x64 preview package generated by the Windows CI pipeline.

            - This is a demo build, not a production release.
            - It does not connect to a live MikroTik/RouterOS/RADIUS environment.
            - Review `README.md` for demo scope and operating guidance.
          files: artifacts/Nexora-Demo-Preview-win-x64.zip
